name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # A tag push does not trigger the Tests workflow (it runs on pushes to main and
  # on pull requests), so without this job `git tag && git push` creates a GitHub
  # release eligible for Registry ingestion regardless of CI state. This gate has
  # two parts: the tagged commit must already have a green Tests run - the only
  # run that includes the acceptance suite, which cannot be executed here because
  # it needs the main-branch-only secrets - and the fast checks are re-run against
  # the exact tagged tree.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a successful Tests run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 scripts/verify-release.py
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - run: go vet -tags e2e ./...
      - run: go test ./... -timeout 120m

  goreleaser:
    name: GoReleaser
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
