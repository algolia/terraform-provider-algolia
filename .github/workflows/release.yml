name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag push does not trigger the Tests workflow (it runs on pushes to main and
  # on pull requests), so without this job `git tag && git push` publishes to the
  # registry regardless of CI state. This gate has two parts: the tagged commit
  # must already have a green Tests run - the only run that includes the
  # acceptance suite, which cannot be executed here because it needs the
  # main-branch-only secrets - and the fast checks are re-run against the exact
  # tagged tree.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a successful Tests run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Wait rather than fail on a run still going. A tag push does not trigger Tests,
          # so this looks for the run started by the push to main that the tag points at,
          # and tagging right after merging is the normal case: on main that run also
          # executes acceptance and e2e, which take about ten minutes. Failing immediately
          # made every timely tag look like a broken release, and the old message blamed a
          # missing run because an in-progress run reports an empty conclusion.
          deadline=$(( SECONDS + 25 * 60 ))
          while :; do
            read -r status conclusion <<<"$(gh run list --workflow=test.yml --commit "$SHA" \
              --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status // "none") \(.conclusion // "")"')"
            status="${status:-none}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Tests for $SHA passed."
                exit 0
              fi
              echo "::error::Tests for $SHA concluded '$conclusion'. Fix main, then move the tag."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ "$status" = "none" ]; then
                echo "::error::No Tests run for $SHA after 25 minutes. Is the tagged commit pushed to main?"
              else
                echo "::error::Tests for $SHA still '$status' after 25 minutes. Re-run this workflow when it finishes."
              fi
              exit 1
            fi

            echo "Tests for $SHA is '$status'; waiting 30s."
            sleep 30
          done
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - run: go vet -tags e2e ./...
      - run: go test ./... -timeout 120m

  goreleaser:
    name: GoReleaser
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
