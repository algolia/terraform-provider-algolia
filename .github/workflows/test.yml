name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # Ensure the e2e-tagged tests still compile even though they are not run here.
      - run: go vet -tags e2e ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned to the version in .tool-versions so CI and local runs use the
          # same linter: `version: latest` silently diverges from what a
          # contributor runs and turns lint into a moving target.
          version: v2.11.3

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -v -timeout 120m
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make testexamples

  acceptance:
    name: Acceptance Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Applying the `acceptance` label approves only the PR head SHA in that event.
    if: >-
      vars.ALGOLIA_APP_ID != '' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'labeled' && github.event.label.name == 'acceptance')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'push' }}
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: TF_ACC=1 go test ./... -v -timeout 120m
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          # Region-routed APIs (Query Suggestions, Personalization, A/B Testing,
          # Ingestion) skip their acceptance tests without this. It is a plain repo
          # variable ("us" or "eu"), not a secret.
          ALGOLIA_ANALYTICS_REGION: ${{ vars.ALGOLIA_ANALYTICS_REGION }}

  e2e:
    name: E2E Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      vars.ALGOLIA_APP_ID != '' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'labeled' && github.event.label.name == 'e2e')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'push' }}
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make e2e
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_ANALYTICS_REGION: ${{ vars.ALGOLIA_ANALYTICS_REGION }}
          # Lets the install-script e2e test (TestE2EInstallScript) download the
          # published release via gh; that test skips if unauthenticated.
          GH_TOKEN: ${{ github.token }}
