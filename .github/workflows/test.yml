name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled are not in the default set, and without them adding the
    # label would not start a run. unlabeled is what makes removing it stop.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # Ensure the e2e-tagged tests still compile even though they are not run here.
      - run: go vet -tags e2e ./...
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Pinned to the version in .tool-versions so CI and local runs use the
          # same linter: `version: latest` silently diverges from what a
          # contributor runs and turns lint into a moving target.
          version: v2.11.3

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -v -timeout 120m
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make testexamples

  acceptance:
    name: Acceptance Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs on a push to main as before, and on a pull request only when a
    # maintainer applies the `acceptance` label. The label changes who can start the
    # run, not whose code runs, so the same-repository check below still matters:
    # GitHub withholds secrets from fork pull requests, and without the check such
    # a run would go green having skipped everything. Never switch this to
    # pull_request_target, which *would* hand the admin key to a fork.
    if: >-
      vars.ALGOLIA_APP_ID != '' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'acceptance'))
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: TF_ACC=1 go test ./... -v -timeout 120m
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          # Region-routed APIs (Query Suggestions, Personalization, A/B Testing,
          # Ingestion) skip their acceptance tests without this. It is a plain repo
          # variable ("us" or "eu"), not a secret.
          ALGOLIA_ANALYTICS_REGION: ${{ vars.ALGOLIA_ANALYTICS_REGION }}

  e2e:
    name: E2E Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same guard as the acceptance job: this job runs repository code with the
    # admin ALGOLIA_API_KEY and a GH_TOKEN, so it must only run on a push to main
    # (post-review), never on a pull request. The repo variable additionally acts
    # as a feature flag for whether an e2e application is configured at all.
    # Runs on a push to main as before, and on a pull request only when a
    # maintainer applies the `e2e` label. The label changes who can start the
    # run, not whose code runs, so the same-repository check below still matters:
    # GitHub withholds secrets from fork pull requests, and without the check such
    # a run would go green having skipped everything. Never switch this to
    # pull_request_target, which *would* hand the admin key to a fork.
    if: >-
      vars.ALGOLIA_APP_ID != '' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'e2e'))
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make e2e
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_ANALYTICS_REGION: ${{ vars.ALGOLIA_ANALYTICS_REGION }}
          # Lets the install-script e2e test (TestE2EInstallScript) download the
          # published release via gh; that test skips if unauthenticated.
          GH_TOKEN: ${{ github.token }}
