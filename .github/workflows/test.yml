name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # Ensure the e2e-tagged tests still compile even though they are not run here.
      - run: go vet -tags e2e ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -v -timeout 120m

  acceptance:
    name: Acceptance Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ALGOLIA_APP_ID != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: TF_ACC=1 go test ./... -v -timeout 120m
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}

  e2e:
    name: E2E Tests
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs whenever the e2e application is configured (repo variable acts as a
    # feature flag; the app_id/api_key themselves are stored as secrets).
    if: vars.ALGOLIA_APP_ID != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The plugin-testing framework auto-downloads the Terraform CLI when none
      # is on PATH; pre-installing it avoids that (and its expired-GPG-key
      # verification failure). terraform_wrapper: false keeps the real binary on
      # PATH so the framework can exec it directly.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make e2e
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}

  install-script:
    name: Install Script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Exercise scripts/install.sh (the README "Quick install") end to end
      # against the latest published release, in both install modes, so a
      # regression in the script or the release assets fails CI.
      - name: Quick install (filesystem mirror) + terraform init
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          version="${tag#v}"
          echo "Testing quick install of $tag (filesystem mirror)"

          ./scripts/install.sh --tag "$tag" \
            --config "$work/terraformrc" \
            --mirror-dir "$work/mirror"

          # the release archive must have landed in the packed mirror layout
          ls "$work/mirror/registry.terraform.io/algolia/algolia/"*.zip

          mkdir -p "$work/tf"
          printf 'terraform {\n  required_providers {\n    algolia = {\n      source  = "algolia/algolia"\n      version = "%s"\n    }\n  }\n}\n' "$version" > "$work/tf/main.tf"

          TF_CLI_CONFIG_FILE="$work/terraformrc" terraform -chdir="$work/tf" init -input=false

      - name: Quick install (dev_overrides) + terraform plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          echo "Testing quick install of $tag (dev_overrides)"

          ./scripts/install.sh --dev-overrides --tag "$tag" \
            --config "$work/terraformrc" \
            --bin-dir "$work/bin"

          test -x "$work/bin/terraform-provider-algolia"

          mkdir -p "$work/tf"
          printf 'terraform {\n  required_providers {\n    algolia = { source = "algolia/algolia" }\n  }\n}\nprovider "algolia" {\n  app_id  = "citestapp"\n  api_key = "ci-test-key"\n}\nresource "algolia_index" "smoke" {\n  name                = "ci-quick-install-smoke"\n  deletion_protection = false\n}\n' > "$work/tf/main.tf"

          # dev_overrides needs no init; a create plan proves the binary loads
          TF_CLI_CONFIG_FILE="$work/terraformrc" terraform -chdir="$work/tf" plan -input=false
