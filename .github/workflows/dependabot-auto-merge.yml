name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge patch updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Only act on Dependabot PRs that originate from this repository and target it.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Enable GitHub's native auto-merge so the PR merges as soon as the required
      # status checks pass.
      #
      # Patch-only, deliberately. The checks reachable from a pull request are
      # Build, Lint and Unit Tests: the acceptance suite runs only on pushes to
      # main, because it needs the admin API key and secrets must not be exposed to
      # PR code. Those three checks cannot detect a behavioural change in
      # algoliasearch-client-go - which is exactly the failure class behind the
      # recommend_rule outage, and minor bumps of that client are where it lives.
      # Minor and major bumps therefore wait for a maintainer, who can merge to main
      # and read the acceptance run before releasing.
      - name: Enable auto-merge for patch bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
